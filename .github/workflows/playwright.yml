name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend
        # Mirror render.yaml: rootDir=backend, command=uvicorn main:app
        run: cd backend && uvicorn main:app --port 8000 &

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && echo "Backend ready after ${i} attempts" && exit 0
            echo "Waiting for backend... ($i/40)"
            sleep 3
          done
          echo "ERROR: Backend failed to start within 120s"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test e2e/frontend/
        env:
          VITE_API_URL: http://localhost:8000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
